name: Docker build and publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "requirements.txt"
      - "requirements.meanvc-runtime.txt"
      - "requirements.worker.txt"
      - "constraints.seamless.txt"
      - "scripts/**"
      - "serverless/**"
      - ".github/workflows/docker-build.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/samuellucky2424-afk/morphly-seamless-meanvc-v1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: docker build --progress=plain -t "$IMAGE_NAME:latest" -t "$IMAGE_NAME:${GITHUB_SHA::12}" .

      - name: Push image
        run: |
          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:${GITHUB_SHA::12}"
